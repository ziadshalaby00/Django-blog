<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Blog{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  {% load bootstrap5 %}
  {% bootstrap_css %}
  {% bootstrap_javascript %}
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-body: #f8f9fb;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #e5e7eb;
      --border-light: #f3f4f6;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-body);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Navbar ===== */
    .main-navbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.92);
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-brand {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }

    .nav-brand:hover { color: var(--accent); }

    .nav-brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-link-item a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-link-item a:hover {
      background: var(--border-light);
      color: var(--text-primary);
    }

    .nav-link-item a.active {
      background: #eff6ff;
      color: var(--accent);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px 4px 4px;
      border-radius: 999px;
      background: var(--border-light);
      transition: all 0.2s ease;
    }

    .nav-user:hover {
      background: var(--border);
    }

    .nav-user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
      box-shadow: var(--shadow-sm);
    }

    .nav-user-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-nav {
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-nav-outline:hover {
      background: var(--border-light);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-nav-primary {
      background: var(--text-primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .btn-nav-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-nav-danger {
      background: transparent;
      color: #ef4444;
      border: 1px solid #fecaca;
    }

    .btn-nav-danger:hover {
      background: #fef2f2;
      color: #dc2626;
    }

    /* Mobile menu */
    .nav-mobile-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
    }

    /* ===== Main Content ===== */
    .main-content {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* ===== Scroll to Top ===== */
    .scroll-top-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--text-primary);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s ease;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      z-index: 999;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .scroll-top-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    /* ===== Footer ===== */
    .main-footer {
      background: var(--text-primary);
      color: var(--text-muted);
      padding: 24px;
      text-align: center;
      font-size: 13px;
      margin-top: auto;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .navbar-inner {
        padding: 0 16px;
        height: 56px;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 56px;
        left: 0;
        right: 0;
        background: var(--bg-card);
        flex-direction: column;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-light);
        box-shadow: var(--shadow-md);
        gap: 4px;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-link-item a {
        width: 100%;
        padding: 12px 16px;
      }

      .nav-mobile-toggle {
        display: block;
      }

      .nav-user-name {
        display: none;
      }

      .nav-user {
        padding: 4px;
      }

      .main-content {
        padding: 16px;
      }

      .nav-right {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="main-navbar">
    <div class="navbar-inner">
      <a class="nav-brand" href='{% url "blog" %}'>
        <div class="nav-brand-icon"><i class="bi bi-pen-fill"></i></div>
        Blog
      </a>

      <button class="nav-mobile-toggle" onclick="toggleMobileMenu()">
        <i class="bi bi-list" id="menuIcon"></i>
      </button>

      <ul class="nav-links" id="navLinks">
        <li class="nav-link-item">
          <a href="{% url 'userInfo' %}"><i class="bi bi-person"></i> Profile</a>
        </li>
      </ul>

      <div class="nav-right">
        {% if request.user.is_authenticated %}
          <a href="{% url 'userInfo' %}" class="nav-user">
            <img class="nav-user-avatar"
              src="{% if request.user.profile.profile_image %}{{request.user.profile.profile_image.url}}{% else %}https://ui-avatars.com/api/?name={{request.user.username|urlencode}}&background=random&color=fff&size=128{% endif %}"
              alt="{{request.user.username}}">
            <span class="nav-user-name">{{request.user.username}}</span>
          </a>
          <form action="{% url 'logout' %}" method="POST" style="margin:0;">
            {% csrf_token %}
            <button class="btn-nav btn-nav-danger" type="submit">
              <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Logout</span>
            </button>
          </form>
        {% else %}
          <a class="btn-nav btn-nav-outline" href='{% url "login" %}'>
            <i class="bi bi-box-arrow-in-right"></i> Login
          </a>
          <a class="btn-nav btn-nav-primary" href='{% url "signup" %}'>
            <i class="bi bi-person-plus"></i> Sign Up
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Scroll to Top -->
  <button onclick="scrollToTop()" id="scrollTopBtn" class="scroll-top-btn">
    <i class="bi bi-arrow-up fs-5"></i>
  </button>

  <!-- Footer -->
  <footer class="main-footer">
    &copy; Ziad Ahmed Shalaby 2025
  </footer>

  <script>
    // Scroll to top
    const scrollTopBtn = document.getElementById("scrollTopBtn");
    window.onscroll = function () {
      if (document.documentElement.scrollTop > 300) {
        scrollTopBtn.classList.add('visible');
      } else {
        scrollTopBtn.classList.remove('visible');
      }
    };

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Mobile menu toggle
    function toggleMobileMenu() {
      const navLinks = document.getElementById('navLinks');
      const menuIcon = document.getElementById('menuIcon');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        menuIcon.classList.remove('bi-list');
        menuIcon.classList.add('bi-x-lg');
      } else {
        menuIcon.classList.remove('bi-x-lg');
        menuIcon.classList.add('bi-list');
      }
    }

    // Close mobile menu on link click
    document.querySelectorAll('.nav-link-item a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('menuIcon').classList.remove('bi-x-lg');
        document.getElementById('menuIcon').classList.add('bi-list');
      });
    });
  </script>

</body>
</html>
